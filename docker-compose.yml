services:
  app:
    build:
      context: .
    volumes:
      - .:/app
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: on-failure
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    depends_on:
      - redis
      - celery
      - celery_beat

  redis:
    image: redis:alpine
    restart: on-failure

  celery:
    build:
      context: .
    volumes:
      - .:/app
    env_file:
      - .env
    restart: on-failure
    command: sh -c "celery -A config worker -l info"
    depends_on:
      - redis

  celery_beat:
    build:
      context: .
    volumes:
      - .:/app
    env_file:
      - .env
    restart: on-failure
    command: sh -c "celery -A config beat -l info"
    depends_on:
      - redis