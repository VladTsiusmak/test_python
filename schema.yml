openapi: 3.0.3
info:
  title: AutoRia Clone API
  version: 1.0.0
  description: Rest API платформи для продажу автомобілів
paths:
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Takes a set of user credentials and returns an access and refresh JSON web
        token pair to prove the authentication of those credentials.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      tags:
      - auth
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/cars/brands/:
    get:
      operationId: cars_brands_list
      description: Доступно всім користувачам
      summary: Список брендів
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - cars
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBrandList'
          description: ''
    post:
      operationId: cars_brands_create
      description: Доступно менеджерам і адміністраторам
      summary: Додати новий бренд
      tags:
      - cars
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Brand'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Brand'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Brand'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
          description: ''
  /api/cars/brands/{id}/:
    get:
      operationId: cars_brands_retrieve
      description: Доступно всім користувачам
      summary: Отримати інформацію про бренд
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - cars
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
          description: ''
    patch:
      operationId: cars_brands_partial_update
      description: Оновлення/виправлення інформації про бренд по ID, дозволено лише
        адміністратору
      summary: Оновити інформацію про бренд
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - cars
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBrand'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBrand'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBrand'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Brand'
          description: ''
    delete:
      operationId: cars_brands_destroy
      description: Видаляє бренд по ID, дозволено лише адміністратору
      summary: Видалити бренд
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - cars
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/cars/brands/{id}/models/:
    get:
      operationId: cars_brands_models_list
      description: Доступно всім користувачам
      summary: Отримати список автомобілів конкретного бренду
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - cars
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCarModelReadList'
          description: ''
  /api/cars/models/:
    get:
      operationId: cars_models_list
      description: Доступно всім користувачам
      summary: Список моделей авто
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - cars
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCarModelReadList'
          description: ''
    post:
      operationId: cars_models_create
      description: Доступно менеджерам і адміністраторам
      summary: Додати нову модель авто
      tags:
      - cars
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CarModelWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CarModelWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CarModelWrite'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarModelWrite'
          description: ''
  /api/cars/models/{id}/:
    get:
      operationId: cars_models_retrieve
      description: Доступно всім користувачам
      summary: Отримати інформацію про модель авто
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - cars
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarModelRead'
          description: ''
    patch:
      operationId: cars_models_partial_update
      description: Оновлення/виправлення інформації про модель авто по ID, дозволено
        лише адміністратору
      summary: Оновити інформацію про модель авто
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - cars
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCarModelWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCarModelWrite'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCarModelWrite'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CarModelWrite'
          description: ''
    delete:
      operationId: cars_models_destroy
      description: Видаляє модель авто по ID, дозволено лише адміністратору
      summary: Видалити модель авто
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - cars
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/cars/request-barnd/:
    post:
      operationId: cars_request_barnd_create
      description: Відправка email адміністрації, доступно залогіненим користувачам
      summary: Відправити запит на додавання нового бренду чи моделі
      tags:
      - cars
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendEmail'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SendEmail'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SendEmail'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendEmail'
          description: ''
  /api/schema/:
    get:
      operationId: schema_retrieve
      description: |-
        OpenApi3 schema for this API. Format can be selected via content negotiation.

        - YAML: application/vnd.oai.openapi
        - JSON: application/vnd.oai.openapi+json
      parameters:
      - in: query
        name: format
        schema:
          type: string
          enum:
          - json
          - yaml
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - af
          - ar
          - ar-dz
          - ast
          - az
          - be
          - bg
          - bn
          - br
          - bs
          - ca
          - ckb
          - cs
          - cy
          - da
          - de
          - dsb
          - el
          - en
          - en-au
          - en-gb
          - eo
          - es
          - es-ar
          - es-co
          - es-mx
          - es-ni
          - es-ve
          - et
          - eu
          - fa
          - fi
          - fr
          - fy
          - ga
          - gd
          - gl
          - he
          - hi
          - hr
          - hsb
          - ht
          - hu
          - hy
          - ia
          - id
          - ig
          - io
          - is
          - it
          - ja
          - ka
          - kab
          - kk
          - km
          - kn
          - ko
          - ky
          - lb
          - lt
          - lv
          - mk
          - ml
          - mn
          - mr
          - ms
          - my
          - nb
          - ne
          - nl
          - nn
          - os
          - pa
          - pl
          - pt
          - pt-br
          - ro
          - ru
          - sk
          - sl
          - sq
          - sr
          - sr-latn
          - sv
          - sw
          - ta
          - te
          - tg
          - th
          - tk
          - tr
          - tt
          - udm
          - ug
          - uk
          - ur
          - uz
          - vi
          - zh-hans
          - zh-hant
      tags:
      - schema
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/vnd.oai.openapi:
              schema:
                type: object
                additionalProperties: {}
            application/yaml:
              schema:
                type: object
                additionalProperties: {}
            application/vnd.oai.openapi+json:
              schema:
                type: object
                additionalProperties: {}
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/users/:
    get:
      operationId: users_list
      description: Адміністратор має повний доступ. Менеджер бачить лише покупців
        і продавців
      summary: Отримати список користувачів
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserReadList'
          description: ''
  /api/users/{id}/:
    get:
      operationId: users_retrieve
      description: Перегляд даних конкретного користувача по ID.
      summary: Отримати акаунт користувача
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
          description: ''
  /api/users/{id}/block/:
    patch:
      operationId: users_block_partial_update
      description: Блокування акаунту по ID.
      summary: Заблокувати користувача
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/users/{id}/delete/:
    delete:
      operationId: users_delete_destroy
      description: М'яке видалення користувача по ID.
      summary: Видалити користувача
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/users/{id}/manager/:
    patch:
      operationId: users_manager_partial_update
      description: Перетворює користувача на менеджера по ID.
      summary: Призначити менеджера
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/users/{id}/unblock/:
    patch:
      operationId: users_unblock_partial_update
      description: Розблокування акаунту по ID.
      summary: Розблокувати користувача
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/users/me/:
    get:
      operationId: users_me_retrieve
      description: Доступно лише власнику.
      summary: Отримати власний акаунт
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRead'
          description: ''
  /api/users/me/delete/:
    delete:
      operationId: users_me_delete_destroy
      description: М'яке видалення власного акаунту.
      summary: Видалити власний акаунт
      tags:
      - users
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/users/me/premium/mock/:
    post:
      operationId: users_me_premium_mock_create
      description: Активація преміум-статусу на 30 днів (заглушка).
      summary: Надати преміум акаунт
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpgrade'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ProfileUpgrade'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ProfileUpgrade'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileUpgrade'
          description: ''
  /api/users/me/update/:
    patch:
      operationId: users_me_update_partial_update
      description: Часткове оновлення власного акаунту.
      summary: Оновити власний акаунт
      tags:
      - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileUpdate'
          description: ''
components:
  schemas:
    AccountTypeEnum:
      enum:
      - basic
      - premium
      type: string
      description: |-
        * `basic` - Базовий
        * `premium` - Преміум
    Brand:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
      required:
      - id
      - name
    CarModelRead:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        brand:
          allOf:
          - $ref: '#/components/schemas/Brand'
          readOnly: true
        name:
          type: string
          maxLength: 100
      required:
      - brand
      - id
      - name
    CarModelWrite:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        brand:
          type: integer
        name:
          type: string
          maxLength: 100
      required:
      - brand
      - id
      - name
    PaginatedBrandList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/Brand'
    PaginatedCarModelReadList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/CarModelRead'
    PaginatedUserReadList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/UserRead'
    PatchedBrand:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
    PatchedCarModelWrite:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        brand:
          type: integer
        name:
          type: string
          maxLength: 100
    PatchedUserProfileUpdate:
      type: object
      properties:
        avatar:
          type: string
          format: uri
          nullable: true
        phone:
          type: string
          maxLength: 20
        profile:
          $ref: '#/components/schemas/ProfileUpdate'
    ProfileRead:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        logo:
          type: string
          format: uri
          nullable: true
        description:
          type: string
          description: Інформація про продавця
        type_profile:
          $ref: '#/components/schemas/TypeProfileEnum'
        account_type:
          $ref: '#/components/schemas/AccountTypeEnum'
        account_expires_at:
          type: string
          format: date-time
          nullable: true
      required:
      - id
      - name
    ProfileUpdate:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
        logo:
          type: string
          format: uri
          nullable: true
        description:
          type: string
          description: Інформація про продавця
      required:
      - name
    ProfileUpgrade:
      type: object
      properties:
        account_type:
          $ref: '#/components/schemas/AccountTypeEnum'
        account_expires_at:
          type: string
          format: date-time
          nullable: true
    Role:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 50
      required:
      - id
      - name
    SendEmail:
      type: object
      properties:
        message:
          type: string
          maxLength: 1000
      required:
      - message
    TokenObtainPair:
      type: object
      properties:
        username:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - password
      - refresh
      - username
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
    TypeProfileEnum:
      enum:
      - individual
      - dealer
      type: string
      description: |-
        * `individual` - Одиночний користувач
        * `dealer` - Автосалон
    UserProfileUpdate:
      type: object
      properties:
        avatar:
          type: string
          format: uri
          nullable: true
        phone:
          type: string
          maxLength: 20
        profile:
          $ref: '#/components/schemas/ProfileUpdate'
      required:
      - phone
      - profile
    UserRead:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        profile:
          $ref: '#/components/schemas/ProfileRead'
        avatar:
          type: string
          format: uri
          nullable: true
        role:
          allOf:
          - $ref: '#/components/schemas/Role'
          readOnly: true
        phone:
          type: string
          maxLength: 20
        deleted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - deleted_at
      - id
      - phone
      - profile
      - role
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
